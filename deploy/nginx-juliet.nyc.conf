# /etc/nginx/sites-available/nyc-ferry-did
#
# juliet.nyc and its app subdomains serve three apps:
#   landing page (this repo)          127.0.0.1:3000  → /
#   ferry departure display (DiD)     127.0.0.1:8090  → ferrytimesmobile.juliet.nyc/
#   Subways for Nerds                 127.0.0.1:8091  → subwaysfornerds.juliet.nyc/
#
# The board was written to live at a domain root: its HTML references
# /app.js, /styles.css, /assets/… and it fetches /api/… — all absolute. Rather
# than patch the board, those root paths are routed to it explicitly below.
# The landing page deliberately avoids every one of them (it uses /css/, /js/,
# /images/ and /_api/status), so the site's services coexist without collisions.

upstream landing_page { server 127.0.0.1:3000; }
upstream ferry_did    { server 127.0.0.1:8090; }
upstream subways_nerds { server 127.0.0.1:8091; keepalive 8; }

server {
    server_name juliet.nyc www.juliet.nyc;

    access_log /var/log/nginx/nyc-ferry-did.access.log;
    error_log  /var/log/nginx/nyc-ferry-did.error.log;

    # Old app URLs stay useful and keep their remaining path and query string.
    rewrite ^/ferryTimesMobile(?:/(.*))?$ https://ferrytimesmobile.juliet.nyc/$1 permanent;
    rewrite ^/subwaysForNerds(?:/(.*))?$ https://subwaysfornerds.juliet.nyc/$1 permanent;
    rewrite ^/subwayForNerds(?:/(.*))?$ https://subwaysfornerds.juliet.nyc/$1 permanent;

    # ---------------------------------------------------------------
    # landing page — everything not claimed below
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://landing_page;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # the board's absolute-path assets and API, kept at the root where it
    # expects them (exact matches so the landing page keeps /css/, /js/, …)
    location = /app.js     { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location = /styles.css { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    # the service worker must be served from the root: its scope is capped by its own path, so a
    # worker under /assets/ could not control the domain root. without this it 404s
    # and the board has no offline shell at all.
    location = /sw.js      { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location /assets/      { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location /api/         { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }


    # ---------------------------------------------------------------
    # Subways for Nerds now has its own host. Keep only the old-path redirects
    # above; its root assets and API are served by the dedicated vhost below.
    # ---------------------------------------------------------------

    # >>> TEMP-HOST rachel >>>
    include /etc/nginx/snippets/rachel-temp.conf;
    # <<< TEMP-HOST rachel <<<

    # >>> lb >>>
    include /etc/nginx/snippets/lb.conf;
    # <<< lb <<<

    # >>> nycferry >>>
    include /etc/nginx/snippets/nycferry.conf;
    # <<< nycferry <<<

    # Gods Eye — isolated application at /GodsEye
    include /etc/nginx/snippets/gods-eye.conf;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/juliet.nyc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/juliet.nyc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.juliet.nyc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = juliet.nyc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name juliet.nyc www.juliet.nyc;
    return 404; # managed by Certbot
}

# HTTP-01 renewal support and HTTPS redirects for both app hosts.
server {
    listen 80;
    listen [::]:80;
    server_name ferrytimesmobile.juliet.nyc subwaysfornerds.juliet.nyc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Dedicated Ferry Times Mobile host. It was built for a domain root, so every
# path (including /api/, /assets/, and /sw.js) passes through unchanged.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ferrytimesmobile.juliet.nyc;

    ssl_certificate /etc/letsencrypt/live/ferrytimesmobile.juliet.nyc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferrytimesmobile.juliet.nyc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://ferry_did;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# Subways for Nerds is built with APP_BASE=/ and serves its own root assets/API.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name subwaysfornerds.juliet.nyc;

    # One SAN certificate covers both app subdomains.
    ssl_certificate /etc/letsencrypt/live/ferrytimesmobile.juliet.nyc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferrytimesmobile.juliet.nyc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://subways_nerds;
        include /etc/nginx/snippets/juliet-proxy.conf;
        proxy_connect_timeout 10s;
    }
}
