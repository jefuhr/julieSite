# /etc/nginx/sites-available/nyc-ferry-did
#
# juliet.nyc serves two apps and one folder of files:
#   landing page (this repo)          127.0.0.1:3000  → /
#   ferry departure display (DiD)     127.0.0.1:8090  → /ferryTimesMobile/
#   lb installer + releases           /var/www/lb     → /lb/
#
# The board was written to live at a domain root: its HTML references
# /app.js, /styles.css, /assets/… and it fetches /api/… — all absolute. Rather
# than patch the board, those root paths are routed to it explicitly below.
# The landing page deliberately avoids every one of them (it uses /css/, /js/,
# /images/, /blog/, /posts.json and /_api/status), so the two apps coexist
# without collisions.

upstream landing_page { server 127.0.0.1:3000; }
upstream ferry_did    { server 127.0.0.1:8090; }

server {
    server_name juliet.nyc www.juliet.nyc;

    access_log /var/log/nginx/nyc-ferry-did.access.log;
    error_log  /var/log/nginx/nyc-ferry-did.error.log;

    # ---------------------------------------------------------------
    # landing page — everything not claimed below
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://landing_page;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # ferry departure display
    # ---------------------------------------------------------------
    location = /ferryTimesMobile {
        return 301 /ferryTimesMobile/;
    }

    # trailing slash on proxy_pass strips the prefix, so the board still sees "/"
    location /ferryTimesMobile/ {
        proxy_pass http://ferry_did/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # the board's absolute-path assets and API, kept at the root where it
    # expects them (exact matches so the landing page keeps /css/, /js/, …)
    location = /app.js     { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location = /styles.css { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location /assets/      { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }
    location /api/         { proxy_pass http://ferry_did; include /etc/nginx/snippets/juliet-proxy.conf; }

    # ---------------------------------------------------------------
    # lb installer — curl -fsSL https://juliet.nyc/lb/install.sh | sh
    # Static files in /var/www/lb. The snippet belongs to github.com/jefuhr/lb
    # (scripts/setup-server.sh), which finds this block by its marker lines,
    # so keep them exactly as written and indented with spaces. Without this
    # block, installing this file would 404 every lb install.
    # ---------------------------------------------------------------
    # >>> lb >>>
    include /etc/nginx/snippets/lb.conf;
    # <<< lb <<<

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/juliet.nyc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/juliet.nyc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.juliet.nyc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = juliet.nyc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name juliet.nyc www.juliet.nyc;
    return 404; # managed by Certbot
}
