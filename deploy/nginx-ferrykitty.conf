# Install as /etc/nginx/sites-available/ferrykitty.juliet.nyc and enable it
# alongside the existing sites. Do not replace the shared juliet.nyc config.
# This bootstrap config serves HTTP; Certbot adds HTTPS after DNS is ready:
#   sudo certbot --nginx -d ferrykitty.juliet.nyc --redirect
# Once Certbot has updated the installed file, preserve its TLS configuration.

server {
	listen 80;
	listen [::]:80;
	server_name ferrykitty.juliet.nyc;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
		try_files $uri =404;
	}

	# Ferry Kitty expects a domain root. Preserve all asset, API, service worker,
	# and WebSocket paths, including their query strings.
	location / {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        "upgrade";
		proxy_read_timeout 60s;
	}
}
